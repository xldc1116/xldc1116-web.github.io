<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义网址导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 40px 15px;
        }
        .wrap {
            max-width: 920px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.08);
        }
        .head {
            background: #2b7cd3;
            color: #fff;
            padding: 22px 30px;
            font-size: 22px;
            font-weight: bold;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid #eee;
            gap: 20px;
        }
        .list-item:hover {
            background-color: #f7f9fc;
        }
        .info {
            flex: 1;
        }
        .name {
            font-size: 17px;
            font-weight: 600;
            color: #111;
            margin-bottom: 4px;
            line-height: 1.5;
        }
        .intro {
            font-size: 14px;
            color: #666;
        }
        .link-box a {
            padding: 8px 18px;
            background: #2b7cd3;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .link-box a:hover {
            background: #2167b1;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head">我的网址导航</div>
    <div id="list"></div>
</div>
<script>

</body>
</html>
